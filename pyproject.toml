[project]
name = "mini-llm"
version = "0.1.0"
description = "A small GPT-style language model implemented from scratch in PyTorch."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Clément Rogissart", email = "clement.rogissart@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

# --- Code quality -----------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: classic errors, I: import order, UP: modern Python syntax,
# B: likely bugs, SIM: simplifications, N: naming conventions
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# Report unused imports but never delete them automatically on save
unfixable = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
